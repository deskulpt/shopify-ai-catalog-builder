# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "a30d29fc96a831fbbc8c71dcddd47472"
name = "Deskulpt Product AI Ingester"
application_url = "https://product-ingest-ai-node.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_metaobjects,write_metaobject_definitions"

[auth]
redirect_urls = [ "https://product-ingest-ai-node.onrender.com/auth/callback" ]

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[product.metafields.app.purchase_type]
type = "single_line_text_field"
name = "Purchase Type"
description = "Determines if the product is direct buy or quote only"

  [product.metafields.app.purchase_type.access]
  admin = "merchant_read_write"

[product.metafields.app.price_unit]
type = "single_line_text_field"
name = "Price Unit"
description = "Unit associated with the price (e.g. Piece, Meter, Kg)"

  [product.metafields.app.price_unit.access]
  admin = "merchant_read_write"

[product.metafields.app.price_currency]
type = "single_line_text_field"
name = "Price Currency"
description = "Currency associated with the price (e.g. USD, INR, GBP, CAD)"

  [product.metafields.app.price_currency.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"

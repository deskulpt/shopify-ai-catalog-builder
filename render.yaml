services:
  - type: web
    name: product-ingest-ai-python
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python services/markitdown_service.py
    envVars:
      - key: PORT
        value: 5005
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: product-ingest-ai-node
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run setup && npm start
    envVars:
      - key: SHOPIFY_API_KEY
        value: bc52c6b4dded536b8abfa06a7a518439
      - key: SHOPIFY_API_SECRET
        value: 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
      - key: SCOPES
        value: write_metaobject_definitions,write_metaobjects,write_products
      - key: SHOPIFY_APP_URL
        value: https://product-ingest-ai-node.onrender.com
      - key: MARKITDOWN_SERVICE_URL
        sync: false
      - key: NODE_ENV
        value: production
